<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HPBOX TV LG</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Arial,Helvetica,sans-serif;}
    body{background:#050608 url("assets/crosstraining-tv-background.png") center center/cover no-repeat fixed;}
    body.hyrox{background-image:url("assets/hyrox-background.png");}
    .shell{position:relative;width:100%;height:100%;box-sizing:border-box;padding:10px 14px 34px 14px;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.16));}
    .days{height:52px;white-space:nowrap;overflow:hidden;margin:0 0 8px 0;}
    .day{display:inline-block;width:13.65%;height:46px;margin-right:.35%;box-sizing:border-box;border:1px solid rgba(255,255,255,.26);border-radius:10px;background:rgba(0,0,0,.18);color:#fff;text-align:center;text-decoration:none;padding-top:5px;font-weight:900;}
    .day span{display:block;font-size:12px;color:#bfc8d2;text-transform:uppercase;line-height:14px;}
    .day strong{display:block;font-size:16px;line-height:18px;}
    .day.active,.day.today{border-color:#54d37d;color:#54d37d;background:rgba(84,211,125,.14);}
    .grid{position:absolute;left:14px;right:14px;top:70px;bottom:34px;}
    .main{position:absolute;left:0;top:0;bottom:0;width:77.5%;box-sizing:border-box;border:1px solid rgba(255,255,255,.20);border-radius:14px;background:rgba(0,0,0,.10);padding:12px;overflow:hidden;}
    .side{position:absolute;right:0;top:0;bottom:0;width:21%;box-sizing:border-box;border:1px solid rgba(255,255,255,.20);border-radius:14px;background:rgba(0,0,0,.16);padding:10px;overflow:hidden;}
    body.hyrox .main{width:100%;}
    body.hyrox .side{display:none;}
    .heading{height:78px;border-bottom:1px solid rgba(255,255,255,.14);overflow:hidden;}
    .kicker{display:block;color:#54d37d;font-size:13px;line-height:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;}
    h1{margin:5px 0 0 0;font-size:40px;line-height:40px;font-weight:900;color:#fff;}
    .sub{margin:2px 0 0 0;font-size:15px;font-weight:900;color:#d8dee8;}
    .sections{position:absolute;left:12px;right:12px;top:100px;bottom:10px;overflow:hidden;}
    .block{position:absolute;box-sizing:border-box;overflow:hidden;background:transparent;}
    .warmup{left:0;top:0;width:31%;height:48%;}
    .strength{left:0;bottom:0;width:31%;height:49%;}
    .wod{left:33%;top:0;width:67%;height:100%;}
    .sections.no-warmup .strength{top:0;bottom:auto;height:100%;}
    .sections.no-warmup .wod{left:33%;width:67%;}
    .sections.no-strength .warmup{height:100%;}
    .sections.no-strength .wod{left:33%;width:67%;}
    .sections.only-wod .wod{left:0;width:100%;}
    .head{height:66px;background-position:left center;background-repeat:no-repeat;background-size:auto 100%;margin-bottom:4px;}
    .warmup .head{background-image:url("assets/training-warm-up-header-clean.png");}
    .strength .head{background-image:url("assets/training-strength-header-clean.png");}
    .wod .head{background-image:url("assets/training-wod-header-clean.png");}
    .body{position:absolute;left:0;right:8px;top:74px;bottom:0;overflow:hidden;}
    pre{margin:0;white-space:pre-wrap;font-family:Arial,Helvetica,sans-serif;color:#fff;font-size:26px;line-height:1.06;font-weight:900;}
    .warmup pre,.strength pre{font-size:24px;line-height:1.05;}
    .wod pre{font-size:25px;line-height:1.05;}
    .sideblock{margin:0 0 10px 0;padding:10px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(0,0,0,.18);overflow:hidden;}
    .sideblock h2{margin:4px 0 8px 0;font-size:24px;line-height:24px;}
    .row{display:block;margin:0 0 7px 0;padding:7px;border-radius:9px;background:rgba(0,0,0,.24);font-size:15px;line-height:1.16;font-weight:900;overflow:hidden;}
    .row small{display:block;color:#bfc8d2;font-size:11px;line-height:13px;margin-top:2px;}
    .score{float:right;color:#ffd36a;font-size:18px;}
    .pin{display:none;}
    .footer{position:absolute;left:14px;right:14px;bottom:7px;height:24px;box-sizing:border-box;padding:3px 8px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(0,0,0,.18);font-size:13px;font-weight:900;color:#d8dee8;}
    .footer span:last-child{float:right;}
    .loading,.empty,.errorbox{padding:22px;font-size:28px;line-height:1.15;font-weight:900;color:#fff;}
    .errorbox{color:#ffd36a;background:rgba(0,0,0,.35);border:1px solid rgba(255,211,106,.50);border-radius:12px;white-space:pre-wrap;}
    .debug{position:absolute;left:14px;right:14px;bottom:34px;z-index:99;display:none;padding:7px;border:1px solid #54d37d;border-radius:8px;background:rgba(0,0,0,.82);font-size:12px;line-height:15px;font-weight:900;color:#fff;}
    body.debug .debug{display:block;}
    body.hyrox .sections{top:100px;}
    body.hyrox .hyroxblock{position:relative;float:left;width:32.2%;height:100%;margin-right:1.7%;box-sizing:border-box;padding:8px;overflow:hidden;}
    body.hyrox .hyroxblock:nth-child(3),body.hyrox .hyroxblock:last-child{margin-right:0;}
    body.hyrox .hyroxblock h3{margin:0 0 8px 0;color:#fff;font-size:28px;line-height:30px;font-weight:900;}
    body.hyrox .hyroxblock .type{display:block;color:#54d37d;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
    body.hyrox .hyroxblock pre{font-size:25px;line-height:1.06;}
  </style>
</head>
<body>
  <div class="shell">
    <div class="days" id="days"></div>
    <div class="grid">
      <div class="main">
        <div class="heading"><span class="kicker" id="modeLabel">HPBOX TV LG</span><h1 id="title">A carregar treino</h1><p class="sub" id="dateLine">A iniciar JavaScript...</p></div>
        <div class="sections" id="sections"><div class="loading">A carregar programação...</div></div>
      </div>
      <div class="side">
        <div class="sideblock" id="pinBox"></div>
        <div class="sideblock"><span class="kicker">Comunidade</span><h2>Top WOD</h2><div id="scores"><div class="row">A carregar...</div></div></div>
        <div class="sideblock"><span class="kicker">Live</span><h2>Atividade</h2><div id="feed"><div class="row">A carregar...</div></div></div>
      </div>
    </div>
    <div class="debug" id="debugBox">Debug...</div>
    <div class="footer"><span>Abre a app no telemóvel para registar resultados.</span><span id="updated">Última atualização: --</span></div>
  </div>
<script>
(function(){
  var CFG={
    url:"https://dkguyclyiicqkzrbcgha.supabase.co",
    key:"sb_publishable_L57UjG_gDDaeYSUnwlV5kw_ry958jU9",
    table:"hpbox_pilot_state",
    id:"hpbox-pilot"
  };
  var els={},state=null,updatedAt="";
  function byId(id){return document.getElementById(id);}
  function log(msg){var d=byId('debugBox'); if(d){d.innerHTML=esc(String(msg));} }
  function appendLog(msg){var d=byId('debugBox'); if(d){d.innerHTML += "<br>"+esc(String(msg));} }
  function param(name){var q=String(window.location.search||''); if(q.charAt(0)==='?') q=q.substring(1); var parts=q.split('&'); for(var i=0;i<parts.length;i++){var p=parts[i].split('='); if(decodeURIComponent(p[0]||'')===name) return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '));} return '';}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
  function isoDate(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10);}
  function pad(n){return n<10?'0'+n:String(n);}
  function selectedDate(){var p=param('date'); return /^\d{4}-\d{2}-\d{2}$/.test(p)?p:isoDate(new Date());}
  function addDays(date,days){var d=new Date(date+'T12:00:00'); d.setDate(d.getDate()+days); return isoDate(d);}
  function monday(date){var d=new Date(date+'T12:00:00'); var day=d.getDay(); var off=day===0?-6:1-day; d.setDate(d.getDate()+off); return isoDate(d);}
  function formatShort(date){var d=new Date(date+'T12:00:00'); return pad(d.getDate())+'/'+pad(d.getMonth()+1);}
  function formatLong(date){var days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado']; var months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; var d=new Date(date+'T12:00:00'); return days[d.getDay()]+', '+d.getDate()+' de '+months[d.getMonth()];}
  function timeNow(){var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes());}
  function init(){
    els={days:byId('days'),modeLabel:byId('modeLabel'),title:byId('title'),dateLine:byId('dateLine'),sections:byId('sections'),scores:byId('scores'),feed:byId('feed'),pinBox:byId('pinBox'),updated:byId('updated')};
    if(param('debug')==='1') document.body.className += ' debug';
    renderDays();
    log('JS OK · '+timeNow()+' · a pedir Supabase...');
    loadState();
    setInterval(function(){ if(state){ renderPin(); } },30000);
  }
  function renderDays(){
    var sel=selectedDate(), mon=monday(sel), today=isoDate(new Date()), html='', names=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    for(var i=0;i<7;i++){var d=addDays(mon,i); var cls='day'; if(d===sel) cls+=' active'; if(d===today) cls+=' today'; html+='<a class="'+cls+'" href="?date='+d+(param('debug')==='1'?'&debug=1':'')+'"><span>'+names[i]+'</span><strong>'+formatShort(d)+'</strong></a>';}
    els.days.innerHTML=html;
  }
  function loadState(){
    var url=CFG.url.replace(/\/$/,'')+'/rest/v1/'+encodeURIComponent(CFG.table)+'?id=eq.'+encodeURIComponent(CFG.id)+'&select=payload,updated_at&_lg='+new Date().getTime();
    try{
      var xhr=new XMLHttpRequest();
      var done=false;
      var timer=setTimeout(function(){ if(done) return; done=true; try{xhr.abort();}catch(e){} showError('Tempo limite ao ligar ao Supabase.\nA TV abriu a página, mas não recebeu dados em 15 segundos.');},15000);
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4 || done) return;
        done=true; clearTimeout(timer);
        appendLog('HTTP '+xhr.status+' · resposta '+String(xhr.responseText||'').length+' chars');
        if(xhr.status<200 || xhr.status>=300){ showError('Erro Supabase HTTP '+xhr.status+'\n'+String(xhr.responseText||'').slice(0,500)); return; }
        try{
          var rows=JSON.parse(xhr.responseText||'[]');
          if(!rows || !rows.length || !rows[0].payload){ showError('Supabase respondeu, mas sem payload.\nResposta: '+String(xhr.responseText||'').slice(0,500)); return; }
          state=normalize(rows[0].payload);
          updatedAt=rows[0].updated_at||'';
          appendLog('OK · workouts '+state.workouts.length+' · hyrox '+state.hyroxWorkouts.length+' · classes '+state.classes.length+' · results '+state.results.length);
          renderAll();
        }catch(e){ showError('Erro a ler JSON/payload.\n'+(e.message||e)); }
      };
      xhr.open('GET',url,true);
      xhr.setRequestHeader('apikey',CFG.key);
      xhr.setRequestHeader('Authorization','Bearer '+CFG.key);
      xhr.setRequestHeader('Accept','application/json');
      try{xhr.setRequestHeader('Cache-Control','no-cache');}catch(e){}
      xhr.send(null);
    }catch(e){ showError('Erro JavaScript/XHR.\n'+(e.message||e)); }
  }
  function normalize(raw){
    raw=raw||{};
    return {workouts:arr(raw.workouts), hyroxWorkouts:arr(raw.hyroxWorkouts||raw.hyroxSessions), classes:arr(raw.classes), results:arr(raw.results||raw.workoutResults||raw.scores), feed:arr(raw.feed||raw.activityFeed), users:arr(raw.users)};
  }
  function arr(v){return Object.prototype.toString.call(v)==='[object Array]'?v:[];}
  function findByDate(list,date){for(var i=0;i<list.length;i++){ if(String(list[i].date||list[i].workoutDate||'').slice(0,10)===date) return list[i]; } return null;}
  function classType(c){var raw=String((c&&(c.classType||c.type||c.kind||c.title||c.name||c.label))||'cross').toLowerCase(); return raw.indexOf('hyrox')>=0?'hyrox':'cross';}
  function minutes(t){var m=String(t||'').match(/(\d{1,2}):(\d{2})/); if(!m) return NaN; return Number(m[1])*60+Number(m[2]);}
  function activeClass(date){
    var now=new Date(), today=isoDate(now); if(date!==today) return null;
    var current=now.getHours()*60+now.getMinutes(); var best=null;
    for(var i=0;i<state.classes.length;i++){var c=state.classes[i]; if(String(c.date||'').slice(0,10)!==date || c.ended) continue; var s=minutes(c.time||c.startTime); var e=minutes(c.endTime||c.end); if(isNaN(e)) e=s+Number(c.duration||60); if(!isNaN(s) && current>=s && current<e) best=c;}
    return best;
  }
  function renderAll(){
    var date=selectedDate(); var ac=activeClass(date); var forced=String(param('force')||'').toLowerCase(); var hyrox=findByDate(state.hyroxWorkouts,date); var workout=findByDate(state.workouts,date); var mode='cross';
    if(forced==='hyrox') mode='hyrox'; else if(forced==='cross') mode='cross'; else if(ac && classType(ac)==='hyrox') mode='hyrox'; else if(!workout && hyrox) mode='hyrox';
    document.body.className = (param('debug')==='1'?'debug ':'') + (mode==='hyrox'?'hyrox':'');
    els.modeLabel.innerHTML=mode==='hyrox'?'HYROX':'HPBOX TV LG';
    els.title.innerHTML=mode==='hyrox'?esc((hyrox&&hyrox.title)||'HYROX'):esc((workout&&workout.title)||'Treino de hoje');
    els.dateLine.innerHTML=esc(formatLong(date)+(ac?' · '+(ac.time||'')+'-'+(ac.endTime||''):'')+' · '+timeNow());
    if(mode==='hyrox') renderHyrox(hyrox,date); else renderCross(workout,date);
    renderCommunity(workout,date); renderPin();
    els.updated.innerHTML='Última atualização: '+(updatedAt?timeNowFromIso(updatedAt):timeNow());
  }
  function renderCross(w,date){
    if(!w){ els.sections.className='sections only-wod'; els.sections.innerHTML='<div class="empty">Sem treino programado para '+esc(formatShort(date))+'.</div>'; return; }
    var warm=clean(w.warmup||w.warmUp||w.aquecimento||''); var str=clean(w.strength||w.forca||w.skill||''); var wod=clean(w.metcon||w.wod||w.workout||'');
    var cls='sections'; if(!warm) cls+=' no-warmup'; if(!str) cls+=' no-strength'; if(!warm&&!str) cls+=' only-wod'; els.sections.className=cls;
    var html='';
    if(warm) html+='<div class="block warmup"><div class="head"></div><div class="body"><pre>'+esc(warm)+'</pre></div></div>';
    if(str) html+='<div class="block strength"><div class="head"></div><div class="body"><pre>'+esc(str)+'</pre></div></div>';
    html+='<div class="block wod"><div class="head"></div><div class="body"><pre>'+esc(wod||'Sem WOD programado.')+'</pre></div></div>';
    els.sections.innerHTML=html;
  }
  function renderHyrox(h,date){
    var blocks=arr(h&&h.blocks); var publicBlocks=[]; for(var i=0;i<blocks.length;i++){var t=String(blocks[i].type||'').toLowerCase(); if(t!=='coach_notes' && clean(blocks[i].content||blocks[i].body||blocks[i].text||'')) publicBlocks.push(blocks[i]);}
    els.sections.className='sections hyrox-sections';
    if(!publicBlocks.length){ els.sections.innerHTML='<div class="empty">Sem HYROX público para '+esc(formatShort(date))+'.</div>'; return; }
    var html=''; var widthClass='';
    for(var j=0;j<publicBlocks.length && j<6;j++){var b=publicBlocks[j]; var title=b.title||labelBlock(b.type)||('Part '+(j+1)); var content=clean(b.content||b.body||b.text||''); html+='<div class="hyroxblock"><span class="type">'+esc(labelBlock(b.type))+'</span><h3>'+esc(title)+'</h3><pre>'+esc(content)+'</pre></div>';}
    els.sections.innerHTML=html;
  }
  function labelBlock(t){t=String(t||'part').toLowerCase(); if(t==='warmup') return 'Warm Up'; if(t==='finisher') return 'Finisher'; if(t==='cooldown') return 'Cooldown'; return 'Part';}
  function clean(v){return String(v||'').replace(/\r\n/g,'\n').replace(/^\s+|\s+$/g,'');}
  function userName(id){for(var i=0;i<state.users.length;i++){if(String(state.users[i].id||'')===String(id||'')) return state.users[i].name||'Atleta';} return 'Atleta';}
  function scoreOf(r){var vals=[r.metconScore,r.wodScore,r.score,r.resultScore,r.finalScore]; if(r.metcon){vals.push(r.metcon.score); vals.push(r.metcon.result);} if(r.wod){vals.push(r.wod.score); vals.push(r.wod.result);} for(var i=0;i<vals.length;i++){if(vals[i]!=null && String(vals[i]).replace(/\s/g,'')!=='') return String(vals[i]);} return '';}
  function resultDate(r){return String(r.workoutDate||r.date||r.createdAt||r.updatedAt||'').slice(0,10);}
  function renderCommunity(w,date){
    var rows=[]; for(var i=0;i<state.results.length;i++){var r=state.results[i]; var sc=scoreOf(r); if(sc && (!date || resultDate(r)===date || String(r.workoutId||'')===String(w&&w.id||''))) rows.push(r);} rows=rows.slice(0,3);
    var h=''; if(!rows.length) h='<div class="row">Sem resultados WOD.</div>'; else for(var j=0;j<rows.length;j++){h+='<div class="row"><span class="score">'+esc(scoreOf(rows[j]))+'</span>'+esc(userName(rows[j].userId||rows[j].athleteId)||rows[j].userName||'Atleta')+'<small>Resultado</small></div>';}
    els.scores.innerHTML=h;
    var f=state.feed.slice(0,3); h=''; if(!f.length) h='<div class="row">Sem atividade recente.</div>'; else for(var k=0;k<f.length;k++){h+='<div class="row">'+esc(userName(f[k].userId)||f[k].userName||'Atleta')+'<small>'+esc(String(f[k].text||f[k].description||f[k].message||'Registou atividade.').slice(0,80))+'</small></div>';}
    els.feed.innerHTML=h;
  }
  function renderPin(){
    if(!state){return;} var date=selectedDate(); var ac=activeClass(date); if(!ac){els.pinBox.style.display='none';return;} var code=String(ac.accessCode||'').replace(/\D/g,''); if(!code){els.pinBox.style.display='none';return;} els.pinBox.style.display='block'; els.pinBox.innerHTML='<span class="kicker">PIN da aula</span><h2 style="font-size:44px;color:#ffd36a;letter-spacing:4px;margin:6px 0">'+esc(code)+'</h2><div class="row">'+esc((ac.time||'')+'-'+(ac.endTime||''))+'</div>';
  }
  function timeNowFromIso(v){var d=new Date(v); if(isNaN(d.getTime())) return '--'; return pad(d.getHours())+':'+pad(d.getMinutes());}
  function showError(msg){ els.title.innerHTML='Erro ao carregar TV'; els.dateLine.innerHTML='Vê o quadro amarelo em baixo'; els.sections.className='sections only-wod'; els.sections.innerHTML='<div class="errorbox">'+esc(msg)+'</div>'; els.scores.innerHTML='<div class="row">Sem dados.</div>'; els.feed.innerHTML='<div class="row">Sem dados.</div>'; appendLog('ERRO: '+msg); }
  if(window.addEventListener) window.addEventListener('load',init,false); else window.onload=init;
})();
</script>
</body>
</html>
