<!doctype html>
<html lang="pt-PT" class="lg-tv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>HPBOX TV LG</title>
    <style>
:root {
  --tv-bg: #050608;
  --tv-panel: rgba(5, 6, 8, 0.20);
  --tv-panel-soft: rgba(5, 6, 8, 0.08);
  --tv-line: rgba(255, 255, 255, 0.14);
  --tv-ink: #f5f7f8;
  --tv-muted: rgba(245, 247, 248, 0.72);
  --tv-green: #54d37d;
  --tv-blue: #72c9ff;
  --tv-gold: #ffd36a;
  --tv-red: #ff7b7b;
  --tv-shadow: 0 18px 62px rgba(0, 0, 0, 0.28);
  --hpbox-training-background-image: url("assets/crosstraining-tv-background.png");
  --hpbox-warmup-header-image: url("assets/training-warm-up-header-clean.png");
  --hpbox-strength-header-image: url("assets/training-strength-header-clean.png");
  --hpbox-wod-header-image: url("assets/training-wod-header-clean.png");
  --hpbox-warmup-filter: none;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  background: var(--tv-bg);
  color: var(--tv-ink);
  overflow: hidden;
}

body {
  position: relative;
  background-color: var(--tv-bg);
  background-image: var(--hpbox-training-background-image);
  background-size: auto 100vh;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(circle at top left, rgba(84, 211, 125, 0.08), transparent 40vw),
    linear-gradient(
      90deg,
      rgba(5, 6, 8, 0.90) 0%,
      rgba(5, 6, 8, 0.88) 28%,
      rgba(5, 6, 8, 0.80) 44%,
      rgba(5, 6, 8, 0.62) 58%,
      rgba(5, 6, 8, 0.38) 72%,
      rgba(5, 6, 8, 0.18) 84%,
      rgba(5, 6, 8, 0.08) 92%,
      rgba(5, 6, 8, 0.00) 100%
    );
  pointer-events: none;
}


body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.06;
  background-image:
    radial-gradient(rgba(255,255,255,0.30) 0.7px, transparent 0.8px),
    radial-gradient(rgba(0,0,0,0.24) 0.7px, transparent 0.8px);
  background-position: 0 0, 10px 10px;
  background-size: 20px 20px;
  mix-blend-mode: soft-light;
}

.tv-shell {
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.62);
}

.tv-shell {
  height: 100vh;
  padding: clamp(18px, 2vw, 34px);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: clamp(14px, 1.6vw, 26px);
}

.tv-topbar,
.tv-footer,
.tv-panel {
  border: 1px solid var(--tv-line);
  background: var(--tv-panel);
  box-shadow: var(--tv-shadow);
}

.tv-topbar {
  min-height: 108px;
  border-radius: 28px;
  padding: clamp(18px, 2vw, 28px) clamp(22px, 2.5vw, 40px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.tv-kicker {
  display: block;
  margin-bottom: 4px;
  color: var(--tv-green);
  font-size: clamp(13px, 1vw, 18px);
  line-height: 1;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.18em;
}

.tv-topbar h1,
.tv-panel-heading h2,
.community-heading h2,
.block-card h3 {
  margin: 0;
  letter-spacing: -0.04em;
}

.tv-panel-heading h2.is-hidden {
  display: none;
}

.tv-topbar h1 {
  font-size: clamp(42px, 5vw, 86px);
  line-height: 0.88;
}

.tv-topbar p {
  margin: 8px 0 0;
  color: var(--tv-muted);
  font-size: clamp(20px, 1.55vw, 30px);
}

.tv-status-card {
  min-width: 210px;
  padding: 16px 20px;
  border-radius: 22px;
  border: 1px solid var(--tv-line);
  background: rgba(5, 6, 8, 0.18);
  text-align: right;
}

.tv-status-card span {
  display: block;
  font-size: clamp(42px, 4.5vw, 76px);
  line-height: 0.9;
  font-weight: 900;
  letter-spacing: -0.05em;
}

.tv-status-card strong {
  display: block;
  margin-top: 10px;
  color: var(--tv-muted);
  font-size: clamp(14px, 1.1vw, 20px);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.tv-day-strip {
  min-height: 74px;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: clamp(8px, 0.8vw, 14px);
}

.tv-day-button {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 18px;
  background: rgba(5, 6, 8, 0.14);
  color: var(--tv-muted);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
  text-align: center;
}

.tv-day-button span,
.tv-day-button strong {
  display: block;
}

.tv-day-button span {
  font-size: clamp(15px, 1.08vw, 22px);
  font-weight: 1000;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.tv-day-button strong {
  margin-top: 4px;
  color: var(--tv-ink);
  font-size: clamp(18px, 1.35vw, 28px);
  line-height: 1;
  font-weight: 1000;
}

.tv-day-button.is-active {
  border-color: rgba(84, 211, 125, 0.82);
  background: rgba(84, 211, 125, 0.18);
  color: var(--tv-green);
}

.tv-day-button.is-today:not(.is-active) {
  border-color: rgba(84, 211, 125, 0.36);
}

.tv-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(370px, 28vw);
  gap: clamp(14px, 1.6vw, 26px);
}

.tv-panel {
  min-height: 0;
  border-radius: 30px;
  overflow: hidden;
}

.tv-workout-panel {
  display: grid;
  grid-template-rows: auto 1fr;
}

.tv-panel-heading {
  padding: clamp(18px, 1.8vw, 28px) clamp(20px, 2vw, 34px);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--tv-line);
}

.tv-panel-heading h2 {
  font-size: clamp(34px, 3.5vw, 62px);
  line-height: 0.96;
}

.tv-tags {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 44%;
}

.tv-tag {
  padding: 8px 12px;
  border: 1px solid var(--tv-line);
  border-radius: 999px;
  background: rgba(5, 6, 8, 0.18);
  color: var(--tv-muted);
  font-size: clamp(13px, 0.95vw, 17px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.workout-sections {
  min-height: 0;
  padding: clamp(12px, 1.2vw, 20px);
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  grid-template-rows: 1fr 1fr;
  grid-template-areas:
    "warmup wod"
    "strength wod";
  gap: clamp(12px, 1.2vw, 20px);
}

.workout-sections.no-warmup {
  grid-template-areas:
    "strength wod"
    "strength wod";
}

.workout-sections.no-strength {
  grid-template-areas:
    "warmup wod"
    "warmup wod";
}

.workout-sections.no-warmup.no-strength {
  grid-template-areas:
    "wod wod"
    "wod wod";
}

.block-card,
.loading-card,
.empty-tv-card {
  min-height: 0;
  border: 1px solid var(--tv-line);
  border-radius: 24px;
  background: rgba(5, 6, 8, 0.10);
  overflow: hidden;
}

.block-card {
  display: grid;
  grid-template-rows: auto 1fr;
  border: 0;
  background: transparent;
  border-radius: 0;
}

.block-card.warmup { grid-area: warmup; }
.block-card.strength { grid-area: strength; }
.block-card.wod { grid-area: wod; }

.block-head {
  position: relative;
  min-height: clamp(60px, 4.4vw, 86px);
  padding: 0;
  display: block;
  background-color: transparent;
  background-size: auto 100%;
  background-repeat: no-repeat;
  background-position: left center;
  isolation: isolate;
}

/*
  Warm-Up e WOD têm ficheiros 2048x512; Strength é 2048x378.
  Para ficarem visualmente com a mesma escala/altura do Strength, estes dois
  precisam de entrar maiores e ser ligeiramente recortados pela moldura.
*/
.block-card.warmup .block-head,
.block-card.wod .block-head {
  background-size: auto 135.45%;
}

.block-head::before {
  content: none;
}

.block-card.warmup .block-head {
  background-image: var(--hpbox-warmup-header-image);
  filter: var(--hpbox-warmup-filter);
}

.block-card.strength .block-head {
  background-image: var(--hpbox-strength-header-image);
}

.block-card.wod .block-head {
  background-image: var(--hpbox-wod-header-image);
}

.block-card h3 {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.block-body {
  min-height: 0;
  padding: clamp(16px, 1.5vw, 26px);
  overflow: hidden;
  background: transparent;
}

.block-body pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--tv-ink);
  font-family: inherit;
  font-size: clamp(29px, 2.18vw, 42px);
  line-height: 1.05;
  font-weight: 800;
}

.block-text-columns {
  min-height: 0;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-content: start;
  gap: clamp(22px, 2vw, 44px);
}

.block-card.strength.is-two-column .block-body pre {
  font-size: clamp(23px, 1.68vw, 34px);
  line-height: 1.07;
}

.workout-sections.no-warmup .block-card.strength.is-two-column .block-body pre {
  font-size: clamp(25px, 1.82vw, 38px);
}

.block-card.wod .block-body pre {
  font-size: clamp(34px, 2.5vw, 50px);
  line-height: 1.08;
}

.tv-community-panel {
  min-height: 0;
  padding: clamp(16px, 1.4vw, 24px);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: clamp(12px, 1.1vw, 18px);
}

.community-block {
  min-height: 0;
  padding: clamp(14px, 1.2vw, 22px);
  border: 1px solid var(--tv-line);
  border-radius: 24px;
  background: rgba(5, 6, 8, 0.10);
  overflow: hidden;
}

.compact-community-block {
  max-height: 25vh;
}

.community-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.community-heading h2 {
  font-size: clamp(24px, 2vw, 38px);
}

.score-list,
.activity-list {
  display: grid;
  gap: 10px;
}

.score-row,
.activity-row {
  display: grid;
  gap: 4px;
  padding: 12px 14px;
  border-radius: 18px;
  background: rgba(5, 6, 8, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.09);
}

.score-row {
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
}

.score-rank {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: rgba(84, 211, 125, 0.16);
  color: var(--tv-green);
  font-size: clamp(18px, 1.5vw, 28px);
  font-weight: 1000;
}

.score-name,
.activity-row strong {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: clamp(19px, 1.35vw, 26px);
  font-weight: 900;
}

.score-value {
  color: var(--tv-gold);
  font-size: clamp(22px, 1.75vw, 34px);
  line-height: 1;
  font-weight: 1000;
  letter-spacing: -0.04em;
}

.score-meta,
.activity-row span {
  color: var(--tv-muted);
  font-size: clamp(13px, 1vw, 18px);
  font-weight: 700;
}

.activity-row p {
  margin: 0;
  color: var(--tv-ink);
  font-size: clamp(17px, 1.18vw, 23px);
  line-height: 1.12;
  font-weight: 750;
}

.activity-list.compact .activity-row p {
  font-size: clamp(15px, 1.05vw, 20px);
}

.tv-footer {
  min-height: 54px;
  padding: 14px 24px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  color: var(--tv-muted);
  font-size: clamp(16px, 1.15vw, 22px);
  font-weight: 800;
}

.empty-tv-card,
.loading-card {
  display: grid;
  place-items: center;
  min-height: 160px;
  padding: 22px;
  color: var(--tv-muted);
  font-size: clamp(22px, 1.8vw, 34px);
  font-weight: 900;
  text-align: center;
}

body.tv-error .tv-status-card strong {
  color: var(--tv-red);
}

@media (max-aspect-ratio: 4 / 3) {
  html,
  body {
    overflow: auto;
  }

  .tv-shell {
    min-height: 100vh;
    height: auto;
  }

  .tv-grid,
  .workout-sections {
    grid-template-columns: 1fr;
  }

  .tv-day-strip {
    grid-template-columns: repeat(7, minmax(96px, 1fr));
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .workout-sections,
  .workout-sections.no-warmup,
  .workout-sections.no-strength,
  .workout-sections.no-warmup.no-strength {
    grid-template-areas:
      "warmup"
      "strength"
      "wod";
  }

  .workout-sections.no-warmup {
    grid-template-areas:
      "strength"
      "wod";
  }

  .workout-sections.no-strength {
    grid-template-areas:
      "warmup"
      "wod";
  }

  .workout-sections.no-warmup.no-strength {
    grid-template-areas:
      "wod";
  }

  .block-text-columns {
    grid-template-columns: 1fr;
  }

  .tv-community-panel {
    grid-template-rows: auto auto auto;
  }
}


/* v13 — modo TV mais compacto: mais conteúdo visível em 1920x1080 */
.tv-shell {
  padding: clamp(12px, 1.15vw, 22px);
  gap: clamp(8px, 0.75vw, 14px);
}

.tv-topbar {
  min-height: 76px;
  border-radius: 22px;
  padding: clamp(12px, 1.15vw, 18px) clamp(16px, 1.7vw, 26px);
}

.tv-kicker {
  margin-bottom: 3px;
  font-size: clamp(10px, 0.72vw, 14px);
  letter-spacing: 0.16em;
}

.tv-topbar h1 {
  font-size: clamp(34px, 3.35vw, 64px);
  line-height: 0.9;
}

.tv-topbar p {
  margin-top: 5px;
  font-size: clamp(15px, 1.15vw, 22px);
}

.tv-status-card {
  min-width: 150px;
  padding: 10px 14px;
  border-radius: 18px;
}

.tv-status-card span {
  font-size: clamp(30px, 3vw, 56px);
}

.tv-status-card strong {
  margin-top: 6px;
  font-size: clamp(10px, 0.78vw, 15px);
}

.tv-day-strip {
  min-height: 50px;
  gap: clamp(6px, 0.55vw, 10px);
}

.tv-day-button {
  padding: 6px 8px;
  border-radius: 14px;
}

.tv-day-button span {
  font-size: clamp(11px, 0.78vw, 16px);
}

.tv-day-button strong {
  margin-top: 2px;
  font-size: clamp(14px, 1vw, 21px);
}

.tv-grid {
  grid-template-columns: minmax(0, 1fr) minmax(300px, 24vw);
  gap: clamp(8px, 0.8vw, 14px);
}

.tv-panel {
  border-radius: 22px;
}

.tv-panel-heading {
  padding: clamp(12px, 1vw, 18px) clamp(14px, 1.3vw, 24px);

}

.tv-panel-heading h2 {
  font-size: clamp(30px, 2.65vw, 50px);
  line-height: 0.95;
}

.tv-tags {
  display: none !important;
}

.workout-sections {
  padding: clamp(7px, 0.65vw, 12px);
  gap: clamp(7px, 0.7vw, 12px);
}

.block-head {
  min-height: clamp(42px, 3.1vw, 60px);
}

.block-body {
  padding: clamp(9px, 0.85vw, 15px);
}

.block-body pre {
  font-size: clamp(16px, 1.25vw, 24px);
  line-height: 1.08;
}

.block-card.strength.is-two-column .block-body pre,
.workout-sections.no-warmup .block-card.strength.is-two-column .block-body pre {
  font-size: clamp(14px, 1.08vw, 21px);
  line-height: 1.08;
}

.block-text-columns {
  gap: clamp(14px, 1.25vw, 26px);
}

.block-card.wod .block-body pre {
  font-size: clamp(18px, 1.45vw, 28px);
  line-height: 1.05;
}

.tv-community-panel {
  padding: clamp(10px, 0.9vw, 16px);
  gap: clamp(8px, 0.7vw, 12px);
}

.community-block {
  padding: clamp(9px, 0.8vw, 14px);
  border-radius: 18px;
}

.compact-community-block {
  max-height: 19vh;
}

.community-heading {
  gap: 8px;
  margin-bottom: 8px;
}

.community-heading h2 {
  font-size: clamp(19px, 1.55vw, 30px);
}

.score-list,
.activity-list {
  gap: 7px;
}

.score-row,
.activity-row {
  padding: 8px 10px;
  border-radius: 14px;
}

.score-row {
  gap: 8px;
}

.score-rank {
  width: 32px;
  height: 32px;
  border-radius: 11px;
  font-size: clamp(15px, 1.05vw, 22px);
}

.score-name,
.activity-row strong {

}

.score-value {
  font-size: clamp(17px, 1.25vw, 25px);
}

.score-meta,
.activity-row span {
  font-size: clamp(10px, 0.78vw, 14px);
}

.activity-row p {
  font-size: clamp(13px, 0.92vw, 18px);
  line-height: 1.08;
}

.activity-list.compact .activity-row p {
  font-size: clamp(12px, 0.82vw, 16px);
}

.tv-footer {
  min-height: 40px;
  padding: 8px 18px;
  border-radius: 16px;
  font-size: clamp(12px, 0.85vw, 16px);
}

/* v14 — ainda mais compacto para caber melhor em Smart TV 1920x1080 */
.tv-shell {
  padding: clamp(8px, 0.85vw, 16px);
  gap: clamp(6px, 0.55vw, 10px);
}

.tv-topbar {
  min-height: 60px;
  border-radius: 18px;
  padding: clamp(8px, 0.85vw, 14px) clamp(12px, 1.25vw, 22px);
}

.tv-kicker {
  margin-bottom: 2px;
  font-size: clamp(9px, 0.62vw, 12px);
  letter-spacing: 0.14em;
}

.tv-topbar h1 {
  font-size: clamp(28px, 2.65vw, 50px);
  line-height: 0.9;
}

.tv-topbar p {
  margin-top: 4px;
  font-size: clamp(12px, 0.9vw, 17px);
}

.tv-status-card {
  min-width: 118px;
  padding: 7px 11px;
  border-radius: 14px;
}

.tv-status-card span {
  font-size: clamp(24px, 2.3vw, 44px);
}

.tv-status-card strong {
  margin-top: 4px;
  font-size: clamp(8px, 0.62vw, 12px);
}

.tv-day-strip {
  min-height: 40px;
  gap: clamp(4px, 0.42vw, 8px);
}

.tv-day-button {
  padding: 4px 7px;
  border-radius: 12px;
}

.tv-day-button span {
  font-size: clamp(9px, 0.65vw, 13px);
  letter-spacing: 0.06em;
}

.tv-day-button strong {
  margin-top: 1px;
  font-size: clamp(12px, 0.86vw, 17px);
}

.tv-grid {
  grid-template-columns: minmax(0, 1fr) minmax(270px, 22vw);
  gap: clamp(6px, 0.6vw, 11px);
}

.tv-panel {
  border-radius: 18px;
}

.tv-panel-heading {
  padding: clamp(8px, 0.72vw, 14px) clamp(10px, 1vw, 18px);
  gap: 8px;
}

.tv-panel-heading h2 {
  font-size: clamp(24px, 2.05vw, 40px);
  line-height: 0.94;
}

.workout-sections {
  padding: clamp(5px, 0.48vw, 9px);
  gap: clamp(5px, 0.5vw, 9px);
}

.block-head {
  min-height: clamp(34px, 2.4vw, 46px);
}

.block-body {
  padding: clamp(6px, 0.62vw, 11px);
